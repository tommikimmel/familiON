<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="FamiliON Icon">
  <!-- App Icon / Favicon (PWA) -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="var(--familion-accent, #0f766e)" />

  <!-- Minimalist ON Toggle Mark -->
  <rect x="10" y="19" width="44" height="26" rx="13" fill="none" stroke="var(--familion-accent-fg, #ffffff)" stroke-width="2.6" opacity="0.92" />

  <!-- Geometric "ON" subtle letters on left -->
  <circle cx="20" cy="32" r="3.4" fill="none" stroke="var(--familion-accent-fg, #ffffff)" stroke-width="1.9" />
  <path d="M26.5 35.4V28.6L31.5 35.4V28.6" fill="none" stroke="var(--familion-accent-fg, #ffffff)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Toggle Knob (Right = ON) -->
  <circle cx="42" cy="32" r="8.2" fill="var(--familion-accent-fg, #ffffff)" />
</svg>
