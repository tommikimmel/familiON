<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 56" width="190" height="56" role="img" aria-label="FamiliON">
  <defs>
    <style>
      .wordmark {
        font-family: 'Inter', 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: -1.1px;
        fill: #111827;
      }
    </style>
  </defs>

  <!-- Wordmark: Famili -->
  <text x="104" y="40" text-anchor="end" class="wordmark">Famili</text>

  <!-- Toggle Track (ON state) -->
