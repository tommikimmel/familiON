  <!-- Geometric "ON" inside toggle -->
  <circle cx="127" cy="28" r="4.5" fill="none" stroke="#ffffff" stroke-width="2.2" />
  <path d="M136.5 32.5V23.5L143.5 32.5V23.5" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Toggle Knob (Right = ON) -->
