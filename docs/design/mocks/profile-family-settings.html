<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FamiliON — Color Picker Personalizado y Edición de Familia</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font-sans, 'Inter', -apple-system, BlinkMacSystemFont, sans-serif);
    background: var(--background, #f8fafc);
    color: var(--foreground, #0f172a);
    padding: 18px;
    line-height: 1.45;
  }
  .num { font-variant-numeric: tabular-nums; }

  .wrap {
    max-width: 820px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    align-items: start;
  }
  @media (max-width: 700px) { .wrap { grid-template-columns: 1fr; } }

  .fn-surface[data-theme="light"] {
    --fn-bg: #fafafa; --fn-card: #ffffff; --fn-card-alt: #f3f4f6;
    --fn-border: #e5e7eb; --fn-text: #111827; --fn-text-2: #4b5563; --fn-muted: #6b7280;
  }
  .fn-surface[data-theme="dark"] {
    --fn-bg: #0b0d11; --fn-card: #141922; --fn-card-alt: #1c2330;
    --fn-border: #232c3a; --fn-text: #f3f4f6; --fn-text-2: #cbd5e1; --fn-muted: #8b95a5;
  }
  .fn-surface {
    --familion-accent: #0f766e;
    --familion-accent-fg: #ffffff;
    --fn-accent-soft: rgba(15, 118, 110, 0.12);
    background: var(--fn-card);
    color: var(--fn-text);
    border: 1px solid var(--fn-border);
    border-radius: 18px;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .card-head {
    display: flex; justify-content: space-between; align-items: center; gap: 8px;
  }
  .card-head strong { font-size: 14px; }
  .mini-btn {
    border: 1px solid var(--fn-border); background: var(--fn-card-alt); color: var(--fn-text-2);
    font-family: inherit; font-size: 11px; font-weight: 600; padding: 4px 10px; border-radius: 8px; cursor: pointer;
  }

  /* Swatches + Custom Color Picker "+" */
  .swatch-row {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .swatch-btn {
    width: 28px; height: 28px; border-radius: 999px; border: 2px solid transparent; cursor: pointer;
    transition: transform 0.16s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .swatch-btn:hover { transform: scale(1.12); }
  .swatch-btn.active { box-shadow: 0 0 0 2px var(--fn-card), 0 0 0 4px currentColor; }

  .custom-picker-wrap {
    position: relative;
    width: 28px; height: 28px;
  }
  .custom-plus-btn {
    width: 28px; height: 28px; border-radius: 999px;
    border: 1.5px dashed var(--fn-muted);
    background: var(--fn-card-alt);
    color: var(--fn-text);
    display: grid; place-items: center;
    cursor: pointer;
    transition: all 0.16s ease;
    pointer-events: none;
  }
  .custom-picker-wrap.active .custom-plus-btn {
    border-style: solid;
    border-color: transparent;
    background: var(--familion-accent);
    color: var(--familion-accent-fg);
    box-shadow: 0 0 0 2px var(--fn-card), 0 0 0 4px var(--familion-accent);
  }
  .native-color-input {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer;
  }

  .preview-strip {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px; border-radius: 14px; background: var(--fn-bg); border: 1px solid var(--fn-border);
  }
  .fab-mini {
    width: 42px; height: 42px; border-radius: 999px;
    background: var(--familion-accent); color: var(--familion-accent-fg);
    display: grid; place-items: center; font-size: 20px; font-weight: 600; flex-shrink: 0;
  }

  .field label { display: block; font-size: 11px; font-weight: 600; color: var(--fn-muted); margin-bottom: 4px; }
  .field input, .field select {
    width: 100%; border: 1px solid var(--fn-border); background: var(--fn-bg); color: var(--fn-text);
    font-family: inherit; font-size: 13px; font-weight: 500; padding: 9px 11px; border-radius: 10px; outline: none;
  }
  .field input:focus, .field select:focus { border-color: var(--familion-accent); }

  .btn-save {
    border: none; background: var(--familion-accent); color: var(--familion-accent-fg);
    font-family: inherit; font-size: 12.5px; font-weight: 700; padding: 10px 14px; border-radius: 11px; cursor: pointer;
    width: 100%;
  }
  .status-msg {
    font-size: 11px; color: var(--fn-muted); display: flex; justify-content: space-between; align-items: center;
  }
  .hex-tag {
    font-family: var(--font-mono, monospace); font-size: 11px; font-weight: 700;
    padding: 2px 7px; border-radius: 6px; background: var(--fn-accent-soft); color: var(--familion-accent);
  }
</style>
</head>
<body>
  <div class="wrap">
    <!-- Card 1: Profile Color Picker with "+" -->
    <div class="fn-surface" id="cardColor" data-theme="light">
      <div class="card-head">
        <strong>Color de tu perfil</strong>
        <button class="mini-btn" onclick="toggleTheme()" id="themeToggle">Tema oscuro</button>
      </div>

      <div class="swatch-row" id="swatchRow"></div>

      <div class="status-msg">
        <span>Color seleccionado (contraste automático WCAG)</span>
        <span class="hex-tag" id="hexReadout">#0F766E</span>
      </div>

      <!-- Live preview of Logo + FAB + Chip with chosen custom color -->
      <div class="preview-strip">
        <div>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 190 56" width="124" height="36">
            <text x="104" y="40" text-anchor="end" style="font-family:'Inter',sans-serif;font-size:34px;font-weight:700;letter-spacing:-1.1px;fill:currentColor;">Famili</text>
            <rect x="110" y="12" width="70" height="32" rx="16" fill="var(--familion-accent)" />
            <circle cx="127" cy="28" r="4.5" fill="none" stroke="var(--familion-accent-fg)" stroke-width="2.2" />
            <path d="M136.5 32.5V23.5L143.5 32.5V23.5" fill="none" stroke="var(--familion-accent-fg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
            <circle cx="164" cy="28" r="11.5" fill="var(--familion-accent-fg)" />
          </svg>
          <div style="font-size:11px;color:var(--fn-muted);margin-top:2px;" id="liveFamilyPreview">Familia Kimmel</div>
        </div>
        <div class="fab-mini">+</div>
      </div>
    </div>

    <!-- Card 2: Editable Family Settings -->
    <div class="fn-surface" id="cardFamily" data-theme="light">
      <div class="card-head">
        <strong>Datos de la Familia</strong>
        <span style="font-size:10.5px;color:var(--fn-muted);">Solo Adulto</span>
      </div>

      <div class="field">
        <label>Nombre de la familia</label>
        <input id="famNameInput" type="text" value="Familia Kimmel" oninput="syncFamilyName()" />
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
        <div class="field">
          <label>Divisa principal</label>
          <select id="famBase">
            <option value="ARS" selected>ARS — Peso Arg.</option>
            <option value="USD">USD — Dólar</option>
            <option value="EUR">EUR — Euro</option>
          </select>
        </div>
        <div class="field">
          <label>Referencia estable</label>
          <select id="famRef">
            <option value="USD_MEP" selected>USD MEP</option>
            <option value="USD_BLUE">USD Blue</option>
            <option value="USD_OFICIAL">USD Oficial</option>
            <option value="EUR_OFICIAL">EUR</option>
          </select>
        </div>
      </div>

      <button class="btn-save" id="saveFamBtn" onclick="saveFamily()">Guardar cambios de la familia</button>
    </div>
  </div>

<script>
  const PRESETS = ['#0F766E', '#2563EB', '#4F46E5', '#7C3AED', '#B45309', '#334155'];
  const state = { theme: 'light', color: '#0F766E', isCustom: false };

  function luminance(hex) {
    const h = hex.replace('#', '');
    const rgb = [0, 2, 4].map(i => {
      let c = parseInt(h.slice(i, i + 2), 16) / 255;
      return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * rgb[0] + 0.7152 * rgb[1] + 0.0722 * rgb[2];
  }

  function hexToRgba(hex, a) {
    const h = hex.replace('#', '');
    return `rgba(${parseInt(h.slice(0,2),16)}, ${parseInt(h.slice(2,4),16)}, ${parseInt(h.slice(4,6),16)}, ${a})`;
  }

  function applyColor() {
    const fg = luminance(state.color) > 0.42 ? '#111827' : '#ffffff';
    document.querySelectorAll('.fn-surface').forEach(el => {
      el.style.setProperty('--familion-accent', state.color);
      el.style.setProperty('--familion-accent-fg', fg);
      el.style.setProperty('--fn-accent-soft', hexToRgba(state.color, state.theme === 'dark' ? 0.18 : 0.12));
    });
    document.getElementById('hexReadout').textContent = state.color.toUpperCase();
    renderSwatches();
  }

  function renderSwatches() {
    document.getElementById('swatchRow').innerHTML = PRESETS.map(hex => `
      <button class="swatch-btn ${!state.isCustom && state.color.toUpperCase() === hex ? 'active' : ''}"
        style="background:${hex};color:${hex};" title="${hex}" onclick="pickPreset('${hex}')"></button>
    `).join('') + `
      <div class="custom-picker-wrap ${state.isCustom ? 'active' : ''}" title="Elegir color personalizado">
        <div class="custom-plus-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </div>
        <input class="native-color-input" type="color" value="${state.color}" oninput="pickCustom(this.value)" />
      </div>
    `;
  }

  function pickPreset(hex) { state.color = hex; state.isCustom = false; applyColor(); }
  function pickCustom(hex) { state.color = hex.toUpperCase(); state.isCustom = true; applyColor(); }

  function toggleTheme() {
    state.theme = state.theme === 'light' ? 'dark' : 'light';
    document.querySelectorAll('.fn-surface').forEach(el => el.setAttribute('data-theme', state.theme));
    document.getElementById('themeToggle').textContent = state.theme === 'light' ? 'Tema oscuro' : 'Tema claro';
    applyColor();
  }

  function syncFamilyName() {
    const val = document.getElementById('famNameInput').value.trim() || 'Mi Familia';
    document.getElementById('liveFamilyPreview').textContent = val;
  }

  function saveFamily() {
    const btn = document.getElementById('saveFamBtn');
    const name = document.getElementById('famNameInput').value.trim() || 'Mi Familia';
    btn.textContent = `✓ Guardado (${name})`;
    setTimeout(() => { btn.textContent = 'Guardar cambios de la familia'; }, 1600);
  }

  applyColor();
</script>
</body>
</html>
