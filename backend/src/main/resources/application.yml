server:
  port: 8081

spring:
  application:
    name: familion-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/familion}
    username: ${DB_USER:familion}
    password: ${DB_PASSWORD:familion}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

familion:
  app:
    version: ${APP_VERSION:0.1.0}
    public-url: ${APP_PUBLIC_URL:http://localhost:8088}
    mail-from: ${MAIL_FROM:no-reply@familion.local}
