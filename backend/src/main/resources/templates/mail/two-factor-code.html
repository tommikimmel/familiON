<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu código de acceso a FamiliON</title>
</head>
<body style="margin:0;padding:0;background-color:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0F172A;">
<table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background-color:#FFFFFF;border:1px solid #E2E8F0;border-radius:12px;padding:32px;">
                <tr>
                    <td style="padding-bottom:24px;border-bottom:1px solid #E2E8F0;">
                        <span style="font-size:24px;font-weight:700;letter-spacing:-0.02em;color:#0F172A;">Famili<span style="color:#0F766E;">ON</span></span>
                    </td>
                </tr>
                <tr>
                    <td style="padding-top:24px;">
                        <p style="margin:0 0 12px 0;font-size:16px;line-height:1.5;">Hola <span th:text="${fullName}">Usuario</span>,</p>
                        <p style="margin:0 0 20px 0;font-size:15px;line-height:1.6;color:#334155;">
                            Detectamos un inicio de sesión desde un dispositivo no reconocido. Ingresa el siguiente código de verificación para continuar:
                        </p>
                        <div style="margin:24px 0;padding:18px 24px;background-color:#F0FDFA;border:1px solid #CCFBF1;border-radius:10px;text-align:center;">
                            <span th:text="${code}" style="font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,'Liberation Mono','Courier New',monospace;font-size:32px;font-weight:700;letter-spacing:0.25em;color:#0F766E;">000000</span>
                        </div>
                        <p style="margin:0 0 24px 0;font-size:14px;line-height:1.5;color:#475569;">
                            Este código vence en <span th:text="${expiresInMinutes}">10</span> minutos y es de un solo uso.
                        </p>
                    </td>
                </tr>
                <tr>
                    <td style="padding-top:20px;border-top:1px solid #E2E8F0;">
                        <p style="margin:0;font-size:12px;line-height:1.5;color:#64748B;">
                            Si no solicitaste esta acción, puedes ignorar este mensaje.
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
