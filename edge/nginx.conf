# FamiliON edge reverse proxy (hardened).
# Single public entry point: routes /bff/* to the BFF and everything else to the frontend.
# See edge/README.md for what each directive protects against.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;

    # Docker embedded DNS.
    resolver 127.0.0.11 valid=30s;

    upstream bff_upstream {
        server bff:8080;
        keepalive 16;
    }

    upstream frontend_upstream {
        server frontend:80;
        keepalive 16;
    }

    # --- Rate limiting / connection limiting ---
    limit_req_zone  $binary_remote_addr zone=auth:10m rate=5r/m;
    limit_req_zone  $binary_remote_addr zone=api:10m  rate=60r/m;
    limit_conn_zone $binary_remote_addr zone=conn:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # --- Anti-slowloris timeouts and body limits ---
    client_body_timeout   10s;
    client_header_timeout 10s;
    keepalive_timeout     15s;
    send_timeout          10s;
    client_max_body_size  1m;

    # --- Basic bot / scripted client filter (applied only on /bff/) ---
    map $http_user_agent $bad_ua {
        default 0;
        ""      1;
        ~*(curl|wget|python-requests|scrapy|httpclient|go-http-client) 1;
    }

    # --- Proxy defaults (inherited by every location) ---
    proxy_http_version 1.1;
    proxy_set_header Connection        "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    server {
        listen 80 default_server;
        server_name _;

        # Only allow the HTTP methods the application uses.
        if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE)$) {
            return 405;
        }

        # --- Security headers ---
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # Edge liveness probe.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        # Sensitive auth endpoints: strict rate limit (5 r/m, burst 3).
        location ~ ^/bff/auth/(login|register|register-invite|forgot-password|reset-password|verify-email|2fa/) {
            if ($bad_ua) {
                return 403;
            }
            limit_req  zone=auth burst=3 nodelay;
            limit_conn conn 20;
            proxy_pass http://bff_upstream;
        }

        # Receipt scan upload: larger body allowed.
        location = /bff/api/receipts/scan {
            if ($bad_ua) {
                return 403;
            }
            client_max_body_size 6m;
            limit_req  zone=api burst=20;
            limit_conn conn 20;
            proxy_pass http://bff_upstream;
        }

        # Profile photo upload: 2 MB app limit plus multipart overhead.
        location = /bff/api/auth/me/avatar {
            if ($bad_ua) {
                return 403;
            }
            client_max_body_size 3m;
            limit_req  zone=api burst=20;
            limit_conn conn 20;
            proxy_pass http://bff_upstream;
        }

        # General BFF API.
        location /bff/ {
            if ($bad_ua) {
                return 403;
            }
            limit_req  zone=api burst=20;
            limit_conn conn 20;
            proxy_pass http://bff_upstream;
        }

        # Frontend (Angular SPA served by its own container).
        location / {
            proxy_pass http://frontend_upstream;
        }
    }
}
