version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: maven
    directory: /bff
    target-branch: develop
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
