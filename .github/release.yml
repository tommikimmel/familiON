changelog:
  categories:
    - title: Features
      labels:
        - feat
        - enhancement
    - title: Fixes
      labels:
        - fix
        - bug
    - title: Docs
      labels:
        - docs
    - title: Maintenance
      labels:
        - chore
        - ci
        - refactor
    - title: Other
      labels:
        - "*"
