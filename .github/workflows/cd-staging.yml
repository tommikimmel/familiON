name: CD Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: Build and push ${{ matrix.app }} (:staging)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, bff, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Dockerfile
        id: check
        run: |
          if [ -f "${{ matrix.app }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.app }}: ${{ matrix.app }}/Dockerfile not found."
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.exists == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.check.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familion-${{ matrix.app }}
          tags: |
            type=raw,value=staging
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy-staging:
    name: Deploy to staging
    needs: build
    if: vars.STAGING_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      # Placeholder deployment: requires STAGING_SSH_HOST, STAGING_SSH_USER, STAGING_SSH_KEY
      # (and optionally STAGING_SSH_PORT, STAGING_DEPLOY_PATH) to be configured in repository settings.
      - name: Pull and restart staging stack via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH }}
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: ${{ secrets.STAGING_SSH_PORT || '22' }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH:-/opt/familion}"
            docker compose pull
            docker compose up -d

  notify:
    name: Notify staging update
    needs: [build, deploy-staging]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      CI_NOTIFY_EMAIL: ${{ secrets.CI_NOTIFY_EMAIL }}
    steps:
      - name: Format commit summary
        if: env.SMTP_HOST != '' && env.CI_NOTIFY_EMAIL != ''
        id: commits
        run: |
          {
            echo "summary<<EOF"
            if jq -e '.commits | length > 0' "$GITHUB_EVENT_PATH" >/dev/null 2>&1; then
              jq -r '.commits[] | "- \(.id[0:7]) \(.message | split("\n")[0]) (\(.author.name))"' "$GITHUB_EVENT_PATH"
            else
              echo "- Manual trigger (${GITHUB_SHA:0:7})"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Send staging notification email
        if: env.SMTP_HOST != '' && env.CI_NOTIFY_EMAIL != ''
        uses: dawidd6/action-send-mail@v24
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT || '587' }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "🧪 Staging updated"
          to: ${{ secrets.CI_NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_USER }}
          body: |
            FamiliON staging images were updated from `${{ github.ref_name }}`.

            Commits:
            ${{ steps.commits.outputs.summary }}

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
