name: CD Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --generate-notes --verify-tag

  images:
    name: Build and push ${{ matrix.app }} (release)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, bff, frontend]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Dockerfile
        id: check
        run: |
          if [ -f "${{ matrix.app }}/Dockerfile" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.app }}: ${{ matrix.app }}/Dockerfile not found."
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.check.outputs.exists == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        if: steps.check.outputs.exists == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/familion-${{ matrix.app }}
          flavor: |
            latest=false
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push Docker image
        if: steps.check.outputs.exists == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy-production:
    name: Deploy to production
    needs: [release, images]
    if: vars.PROD_DEPLOY_ENABLED == 'true'
    environment: production
    runs-on: ubuntu-latest
    steps:
      # Placeholder deployment: requires PROD_SSH_HOST, PROD_SSH_USER, PROD_SSH_KEY
      # (and optionally PROD_SSH_PORT, PROD_DEPLOY_PATH) configured in the production environment.
      - name: Backup PostgreSQL database via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH }}
          RELEASE_TAG: ${{ github.ref_name }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || '22' }}
          envs: DEPLOY_PATH,RELEASE_TAG
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH:-/opt/familion}"
            mkdir -p backups
            set -a
            # shellcheck disable=SC1091
            source .env
            set +a
            docker compose exec -T postgres pg_dump -U "${POSTGRES_USER}" "${POSTGRES_DB}" > "backups/familion-${RELEASE_TAG}-$(date -u +%Y%m%dT%H%M%SZ).sql"

      - name: Pull images and restart production stack via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || '22' }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH:-/opt/familion}"
            docker compose pull
            docker compose up -d

      - name: Verify application health via SSH
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_PATH: ${{ vars.PROD_DEPLOY_PATH }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || '22' }}
          envs: DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "${DEPLOY_PATH:-/opt/familion}"
            docker compose exec -T backend wget -qO- http://localhost:8081/actuator/health
            docker compose exec -T bff wget -qO- http://localhost:8080/actuator/health

  notify:
    name: Notify release
    needs: [release, images, deploy-production]
    if: always() && !failure() && !cancelled()
    runs-on: ubuntu-latest
    env:
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      CI_NOTIFY_EMAIL: ${{ secrets.CI_NOTIFY_EMAIL }}
    steps:
      - name: Send release notification email
        if: env.SMTP_HOST != '' && env.CI_NOTIFY_EMAIL != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT || '587' }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "🚀 FamiliON ${{ github.ref_name }} released"
          to: ${{ secrets.CI_NOTIFY_EMAIL }}
          from: ${{ secrets.SMTP_USER }}
          body: |
            FamiliON ${{ github.ref_name }} has been released.

            Release notes: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
