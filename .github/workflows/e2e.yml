name: E2E Smoke Tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: Full-stack Playwright smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Prepare environment file
        run: |
          cp .env.example .env
          secret="$(openssl rand -base64 48 | tr -d '\n')"
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=${secret}|" .env

      - name: Start full stack with Docker Compose
        timeout-minutes: 10
        run: docker compose up -d --build --wait

      - name: Install E2E dependencies and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright smoke tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

      - name: Dump Docker Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down -v
