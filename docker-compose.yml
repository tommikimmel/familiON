name: familion

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal_net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal_net

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - internal_net

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM: ${MAIL_FROM}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL}
      APP_VERSION: ${APP_VERSION}
      ECON_DOLARAPI_URL: ${ECON_DOLARAPI_URL}
      ECON_ARGDATOS_URL: ${ECON_ARGDATOS_URL}
      ECON_SYNC_CRON: ${ECON_SYNC_CRON}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT}
      RECEIPTS_STORAGE_DIR: /data/receipts
    volumes:
      - receipts:/data/receipts
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - internal_net

  bff:
    build: ./bff
    restart: unless-stopped
    environment:
      CORE_API_URL: http://backend:8081
      REDIS_HOST: redis
      REDIS_PORT: 6379
      COOKIE_SECURE: ${COOKIE_SECURE}
      BFF_RATE_LIMIT_PER_MIN: ${BFF_RATE_LIMIT_PER_MIN}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - internal_net

  frontend:
    build: ./frontend
    restart: unless-stopped
    networks:
      - internal_net

  edge:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      bff:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - public_net
      - internal_net

networks:
  public_net:
    driver: bridge
  internal_net:
    driver: bridge

volumes:
  pgdata:
  receipts:
